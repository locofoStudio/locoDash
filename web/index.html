<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Cache control headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Camera permissions policy -->
  <meta http-equiv="Permissions-Policy" content="camera=*">
  
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="locodashboard">
  <link rel="apple-touch-icon" href="locotag_1.png">
  
  <!-- Camera permissions for web -->
  <meta name="camera-control" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="locotag_1.png"/>

  <title>locodashboard</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@1.1.0/dist/BarcodeDetectorPolyfill.web.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    window.jsQR = jsQR;
    /* Register the barcode detector */
    if (typeof BarcodeDetector === 'undefined') {
      BarcodeDetectorPolyfill.installPolyfill();
    }
    
    // Clear any cached data that might interfere with QR scanning
    try {
      // Clear localStorage and sessionStorage
      if (typeof Storage !== "undefined") {
        localStorage.clear();
        sessionStorage.clear();
      }
      
      // Clear IndexedDB if available
      if ('indexedDB' in window) {
        indexedDB.databases().then(databases => {
          databases.forEach(db => {
            if (db.name && db.name.includes('qr') || db.name.includes('camera')) {
              indexedDB.deleteDatabase(db.name);
            }
          });
        }).catch(e => console.log('IndexedDB cleanup failed:', e));
      }
      
      console.log('Cache cleared for fresh QR scanner session');
    } catch (e) {
      console.log('Cache clearing failed:', e);
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
